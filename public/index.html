<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="/manifest.webmanifest"><title>Daily Activity</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f7;color:#102321}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 18px 90px}.head{padding:24px 2px 12px}.head h1{margin:0;font-size:29px}.muted{color:#667774}.nav{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:18px;padding:10px 12px;box-shadow:0 4px 18px #0000000c}.nav button,.today{border:0;background:#e8f5f2;border-radius:12px;padding:10px 14px;font-weight:700}.date{text-align:center;font-weight:750}.summary{display:flex;gap:10px;margin:16px 0}.pill{flex:1;background:#0f766e;color:white;border-radius:15px;padding:13px;text-align:center}.task{display:flex;gap:12px;background:white;margin:10px 0;padding:15px;border-radius:17px;box-shadow:0 3px 14px #0000000b}.task input{width:24px;height:24px;accent-color:#0f766e}.task.done{opacity:.55}.task.done .title{text-decoration:line-through}.title{font-weight:750;font-size:17px}.meta{font-size:13px;color:#6a7876;margin-top:5px}.fab{position:fixed;right:22px;bottom:28px;border:0;border-radius:50%;width:58px;height:58px;background:#0f766e;color:white;font-size:32px;box-shadow:0 7px 20px #0004}.empty{text-align:center;padding:60px 20px;color:#71817e}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}.sheet{background:white;width:min(680px,100%);border-radius:24px 24px 0 0;padding:22px;box-sizing:border-box}.sheet input,.sheet textarea,.sheet select{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 12px;border:1px solid #d8e0df;border-radius:12px;font:inherit}.row{display:flex;gap:10px}.row>*{flex:1}.save{width:100%;border:0;background:#0f766e;color:white;padding:14px;border-radius:13px;font-weight:750}.cancel{width:100%;border:0;background:white;padding:12px;color:#667}.notice{background:#fff4cf;border-radius:12px;padding:10px;margin:10px 0;font-size:13px}@media(min-width:800px){.fab{right:calc(50% - 340px)}}</style></head><body><div class="app"><div class="head"><h1>Daily Activity</h1><div class="muted">Focus on one day at a time.</div></div><div class="nav"><button id="prev">‹</button><div class="date"><div id="dayName"></div><div class="muted" id="dateText"></div></div><button id="next">›</button></div><div style="text-align:center;margin:9px"><button class="today" id="today">Today</button></div><div class="summary"><div class="pill"><b id="completed">0</b><br><small>Completed</small></div><div class="pill"><b id="remaining">0</b><br><small>Remaining</small></div></div><div id="status" class="notice">Connecting to Supabase…</div><div id="tasks"></div></div><button class="fab" id="add">+</button><div class="modal" id="modal"><div class="sheet"><h2 style="margin-top:0">Add activity</h2><label>Activity</label><input id="title" placeholder="e.g. Team meeting"><div class="row"><div><label>Time</label><input id="time" type="time"></div><div><label>Reminder</label><select id="reminder"><option value="5">5 min before</option><option value="10">10 min before</option><option value="15" selected>15 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option></select></div></div><label>Notes</label><textarea id="notes" rows="3"></textarea><label>Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><button class="save" id="save">Save activity</button><button class="cancel" id="cancel">Cancel</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/app.js"></script></body></html>
