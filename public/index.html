v class="userbar"><span id="signedInAs" class="muted"></span><button id="logout" class="logout">Sign out</button></div><h1>Daily Activity</h1><div class="muted">Focus on one day at a time.</div></div><div class="nav"><button id="prev">‹</button><div class="date" id="dateButton"><div id="dayName"></div><div class="muted" id="dateText"></div><input class="dateJump" id="dateJump" type="date"></div><button id="next">›</button></div><div style="text-align:center;margin:9px"><button class="today" id="today">Today</button></div><div class="summary"><div class="pill"><b id="completed">0</b><br><small>Completed</small></div><div class="pill"><b id="remaining">0</b><br><small>Remaining</small></div></div><div id="status" class="notice hidden"></div><div id="tasks"></div></div><button class="fab hidden" id="add">+</button><div class="modal" id="modal"><div class="sheet"><h2 style="margin-top:0">Add activity</h2><div class="field"><label>Activity</label><input id="title" placeholder="e.g. Team meeting"></div><div class="field"><label>Activity date</label><input id="activityDate" type="date"></div><div class="formgrid"><div class="field"><label>Time</label><input id="time" type="time"></div><div class="field"><label>Reminder</label><select id="reminder"><option value="5|minutes">5 minutes before</option><option value="10|minutes">10 minutes before</option><option value="15|minutes" selected>15 minutes before</option><option value="30|minutes">30 minutes before</option><option value="60|minutes">1 hour before</option><option value="1|days">1 day before</option><option value="1|weeks">1 week before</option><option value="2|weeks">2 weeks before</option><option value="1|months">1 month before</option></select></div></div><div class="field"><label>Notes</label><textarea id="notes" rows="3"></textarea></div><div class="field"><label>Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekdays">Weekdays</opt
