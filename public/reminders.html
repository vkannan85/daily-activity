<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>All Reminders</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102321;background:linear-gradient(145deg,#f8fcfb,#edf8f5 48%,#f6fbff);min-height:100vh}.app{max-width:720px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px 80px}.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.back{border:0;background:#e8f5f2;border-radius:12px;padding:10px 13px;font-size:20px;color:#075f54}.top h1{margin:0;font-size:27px}.sub{color:#667774;margin:0 0 18px 52px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toggle{border:1px solid #cddbd8;background:#fff;color:#31504b;border-radius:999px;padding:8px 12px;font-weight:700}.count{font-size:13px;color:#667774;font-weight:700}.dateHead{font-size:13px;font-weight:800;color:#56716c;text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 7px}.task{display:flex;gap:12px;background:#ffffffe8;margin:9px 0;padding:15px;border:1px solid #fff;border-radius:17px;box-shadow:0 7px 24px #315f5710}.task.overdue{background:#fff8f6;border-color:#e0a49a}.task.done{opacity:.55}.task.done .title{text-decoration:line-through}.task input{width:24px;height:24px;accent-color:#0f766e}.title{font-weight:750;font-size:17px}.meta{font-size:13px;color:#6a7876;margin-top:5px}.tag{display:inline-block;margin-top:7px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#e8f5f2;color:#075f54}.overdue .tag{background:#f7ded9;color:#8b3022}.empty{text-align:center;color:#71817e;padding:70px 20px}.notice{background:#fff4cf;border-radius:12px;padding:10px;margin:10px 0}.hidden{display:none}</style></head><body><div class="app"><div class="top"><button class="back" onclick="location.href='/'">‹</button><h1>All Reminders</h1></div><div class="sub">Everything in one place</div><div class="toolbar"><button id="toggle" class="toggle">Show completed</button><span id="count" class="count"></span></div><div id="status" class="notice hidden"></div><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>let client,user,showCompleted=false;const $=id=>document.getElementById(id),parse=s=>new Date(s+'T12:00:00'),fmt=s=>parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});async function init(){const c=window.APP_CONFIG||{};client=supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});const{data}=await client.auth.getSession();user=data.session?.user;if(!user)return location.href='/';load()}async function load(){const{data,error}=await client.from('daily_activities').select('*').eq('user_id',user.id).order('activity_date',{ascending:true}).order('start_time',{ascending:true});if(error){$('status').classList.remove('hidden');$('status').textContent=error.message;return}const all=data||[],visible=all.filter(x=>showCompleted||!x.is_completed);$('count').textContent=`${visible.length} reminder${visible.length===1?'':'s'}`;$('toggle').textContent=showCompleted?'Hide completed':'Show completed';const list=$('list');list.innerHTML='';if(!visible.length){list.innerHTML='<div class="empty">No reminders to show.</div>';return}let last='';const today=new Date();today.setHours(0,0,0,0);for(const x of visible){if(x.activity_date!==last){const h=document.createElement('div');h.className='dateHead';h.textContent=fmt(x.activity_date);list.appendChild(h);last=x.activity_date}const overdue=parse(x.activity_date)<today&&!x.is_completed,d=document.createElement('div');d.className='task '+(overdue?'overdue ':'')+(x.is_completed?'done':'');d.innerHTML=`<input type="checkbox" ${x.is_completed?'checked':''}><div><div class="title"></div><div class="meta">${x.start_time?x.start_time.slice(0,5):'Any time'}${x.recurrence&&x.recurrence!=='none'?' · ↻ '+x.recurrence:''}</div><span class="tag">${overdue?'Overdue · ':''}${fmt(x.activity_date)}</span></div>`;d.querySelector('.title').textContent=x.title;d.querySelector('input').onchange=async e=>{await client.from('daily_activities').update({is_completed:e.target.checked,completed_at:e.target.checked?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',x.id).eq('user_id',user.id);load()};d.ondblclick=()=>{location.href='/?edit='+encodeURIComponent(x.id)};list.appendChild(d)}}$('toggle').onclick=()=>{showCompleted=!showCompleted;load()};init();</script></body></html>
